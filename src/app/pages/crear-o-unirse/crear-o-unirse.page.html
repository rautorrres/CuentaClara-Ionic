<ion-content class="ion-padding">
  <h1>Crear o unirse</h1>
  <div class="card">
    <p class="etiqueta">Crear un grupo</p>
    <ion-item><ion-input label="Nombre del grupo" labelPlacement="floating" placeholder="Casa Los Aromos"></ion-input></ion-item>
    <ion-button expand="block" shape="round" routerLink="/tabs/inicio">Crear grupo</ion-button>
  </div>
  <div class="card">
    <p class="etiqueta">Unirme con un código</p>
    <ion-item><ion-input label="Código o enlace de invitación" labelPlacement="floating"></ion-input></ion-item>
    <ion-button expand="block" fill="outline" shape="round" routerLink="/tabs/inicio">Unirme</ion-button>
  </div>
</ion-content>
